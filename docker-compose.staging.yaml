services:
        
  web:
    env_file:
      - .env.production
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:appwatch_backend
    expose:
      - 8000
    restart: always
    depends_on:
      - redis
      - elasticsearch

  nginx-proxy:
    container_name: nginx-proxy
    image: nginxproxy/nginx-proxy
    restart: on-failure:10
    volumes:
      - static_volume:/home/app/web/staticfiles
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - /var/run/docker.sock:/tmp/docker.sock:ro
    ports:
      - 443:443
      - 80:80
    depends_on:
      - web

  acme-companion:
    image: nginxproxy/acme-companion
    restart: on-failure:10
    environment:
      - DEFAULT_EMAIL=smitk85143@gmail.com
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

  redis:
    image: redis:alpine
    restart: always

  celery_worker:
    command: celery -A playstore_frontend worker -l info -P gevent
    env_file:
      - .env.production
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:celery_worker
    depends_on:
      - web
      - redis
    restart: always

  celery_beat:
    command: celery -A playstore_frontend beat -l info
    env_file:
      - .env.production
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:celery_beat
    depends_on:
      - web
      - redis
    restart: always

  elasticsearch:
    image: elasticsearch:7.17.25
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    restart: always

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama/ollama:/root/.ollama
    ports:
      - 11434:11434

volumes:
  static_volume:
  certs:
  html:
  vhost:
  acme:
  esdata01: