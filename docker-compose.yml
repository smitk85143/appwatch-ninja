services:
        
  web:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - static_volume:/home/app/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:appwatch_backend
    expose:
      - 8000
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:alpine

  celery_worker:
    build: 
      context: ./backend
      args:
        service: worker
    command: celery -A backend worker -l info
    env_file:
      - .env.production
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:celery_worker
    depends_on:
      - web
      - redis

  celery_beat:
    build: 
      context: ./backend
      args:
        service: beat
    command: celery -A backend beat -l info
    env_file:
      - .env.production
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:celery_beat
    depends_on:
      - web
      - redis

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  static_volume:
  certs:
  html:
  vhost:
  acme:
  postgres_data: