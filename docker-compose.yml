services:
        
  web:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - static_volume:/home/app/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:appwatch_backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:alpine

  celery_worker:
    build: 
      context: ./backend
      args:
        service: worker
    command: celery -A backend worker -l info
    env_file:
      - .env
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:celery_worker
    depends_on:
      - web
      - redis

  celery_beat:
    build: 
      context: ./backend
      args:
        service: beat
    command: celery -A backend beat -l info
    env_file:
      - .env
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:celery_beat
    depends_on:
      - web
      - redis

  celery_flower:
    build: 
      context: ./backend
      args:
        service: flower
    command: celery -A backend flower
    env_file:
      - .env
    volumes:
      - static_volume:/home/app/web/staticfiles
    image: smitkukadiyabvminfotech/playstore_frontend:celery_flower
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - web
      - redis
      - celery_worker
      - celery_beat

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  meilisearch:
    image: getmeili/meilisearch
    env_file:
      - .env
    volumes:
      - meili-search:/data.ms
    ports:
      - "127.0.0.1:7700:7700"

volumes:
  static_volume:
  meili-search:
  postgres_data: