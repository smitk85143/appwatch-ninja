services:

  redis:
    image: redis:alpine
    ports:
      - 6379:6379

  elasticsearch:
    image: elasticsearch:7.17.25
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama/ollama:/root/.ollama
    ports:
      - 11434:11434

volumes:
  esdata01: