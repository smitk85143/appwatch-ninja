services:

  redis:
    image: redis:alpine
    ports:
      - 6379:6379

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./ollama/ollama:/root/.ollama
    ports:
      - 11434:11434

  meilisearch:
    image: getmeili/meilisearch
    env_file:
      - .env
    volumes:
      - meili-search:/data.ms
    ports:
      - 7700:7700

volumes:
  esdata01:
  meili-search: